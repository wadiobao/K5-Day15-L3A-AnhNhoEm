# Khóa file này trước CP2 (19:30 Thứ Sáu 27/11) — Không sửa sau CP2.
# Gắn trực tiếp với nỗi đau trong evidence/summary.md và chuẩn đạt tại spec.md §7.

metrics:
  - name: label_accuracy
    definition: "Tỷ lệ phần trăm review được hệ thống gán đúng 1 trong 4 nhãn chuẩn (verified_insight, low_signal, suspicious_pattern, logistics_only) so với cột expected trong eval/benchmark.csv."
    grader: code
    threshold: ">= 85%"
    why: "Nếu phân loại sai review nhận xu/seeding thành trải nghiệm thật hoặc ngược lại, người mua sẽ tiếp tục bị đánh lừa bởi điểm sao ảo."

  - name: direction_match
    definition: "Tỷ lệ phần trăm sản phẩm (test case) có chiều biến động Điểm tin cậy thực so với điểm sàn khớp với nhãn kỳ vọng (near_platform, lower_than_platform, higher_than_platform)."
    grader: code
    threshold: ">= 85%"
    why: "Giải quyết trực tiếp nỗi đau quyết định mua sai: sản phẩm tốt thật không bị báo động oan, sản phẩm seeding dày phải lộ điểm thực thấp hơn, và hàng bị 1 sao do shipper không bị kéo tụt oan."

  - name: citation_grounding
    definition: "Tỷ lệ phần trăm đoạn trích dẫn bằng chứng (evidence_quote) xuất hiện nguyên văn trong nội dung review đầu vào sau khi chuẩn hóa khoảng trắng và chữ hoa/thường."
    grader: code
    threshold: "== 100%"
    why: "Đảm bảo tính minh bạch để người mua tự kiểm chứng, loại bỏ hoàn toàn rủi ro AI bịa lý do khi gán nhãn tín hiệu rủi ro."

  - name: actionable_quality
    definition: "Đánh giá bởi người chấm xem Top 3 rủi ro và 3 câu hỏi kiểm chứng shop có sát với phàn nàn thực tế trong cụm review hay không (thang đạt/không đạt)."
    grader: nguoi
    threshold: ">= 80%"
    why: "Giúp người mua tiết kiệm thời gian đọc lọc và có ngay câu hỏi cụ thể để kiểm chứng với shop trước khi đặt hàng."
