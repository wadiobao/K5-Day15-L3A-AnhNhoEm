# Cấu hình mô phỏng chi phí cho ReviewShield (chạy qua: python run.py simulate)
# Lưu ý: Các tỷ lệ người dùng và tần suất là giả định vận hành ban đầu (tự ước tính) cho giai đoạn MVP;
# Thành viên 4 cập nhật lại theo số liệu khảo sát/phỏng vấn thật khi có evidence/summary.md.

sessions: 50
seed: 42

users:
  low: 300
  base: 700
  high: 1000
  source: "(tự ước tính) Quy mô người mua online mục tiêu giai đoạn MVP 3 kịch bản thấp/cơ sở/cao"

personas:
  - name: mua_it
    share: 0.50
    uses_per_month: 4
    turns_per_session: 1
    description: "Người mua hàng thỉnh thoảng, kiểm tra 1-2 sản phẩm/tuần trước khi đặt đơn."
    source: "(tự ước tính) Giả định 1 phiên/tuần (~4 phiên/tháng), cập nhật sau khi có khảo sát"

  - name: mua_vua
    share: 0.35
    uses_per_month: 10
    turns_per_session: 3
    description: "Người mua hàng thường xuyên, so sánh 2-3 sản phẩm cùng loại trước khi chốt."
    source: "(tự ước tính) Giả định 2-3 phiên/tuần (~10 phiên/tháng), cập nhật sau khi có khảo sát"

  - name: san_sale_nhieu
    share: 0.15
    uses_per_month: 20
    turns_per_session: 5
    description: "Người săn sale hoặc kiểm tra nhiều sản phẩm giá trị cao liên tục."
    source: "(tự ước tính) Giả định 4-5 phiên/tuần (~20 phiên/tháng), cập nhật sau khi có khảo sát"

prices:
  - model: gemini-2.5-flash
    input: 0.15
    output: 0.60
    source: "https://ai.google.dev/gemini-api/docs/pricing (cần xác nhận lại ngày xem trước CP4)"

  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "https://openai.com/api/pricing/ (cần xác nhận lại ngày xem trước CP4)"

usd_to_vnd:
  rate: 25500
  source: "(tự ước tính) Tỷ giá tham khảo USD/VND"
